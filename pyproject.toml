[project]
name = "moniker"
version = "0.1.0"
description = "A simple API to help name things."
readme = "README.md"
authors = [
    { name = "makejames", email = "james@makejames.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "uvicorn>=0.52.4",
]

[project.scripts]
moniker = "moniker:main"

[project.dev-scripts]
ruff = {cmd = "ruff check ./src/ ./tests/"}
ruff-format = {cmd = "ruff format"}

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "httpx2>=2.12.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
select = ["D", "S", "F", "PT", "ANN", "ASYNC", "FAST", "B", "SIM", "E", "W", "PL", "N"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pylint]
max-args = 10

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101"]

[tool.setuptools.package-data]
"pkgname" = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
